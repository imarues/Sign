name: Apply Library card actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_library_actions.py'
      - '.github/workflows/apply-library-card-actions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_library_actions.py

      - name: Verify requested behavior
        run: |
          set -euo pipefail
          grep -F 'FileImporterRepresentableView(' Feather/Views/Library/LibraryView.swift
          grep -F 'BatSignLibraryOnly_' Feather/Views/Library/LibraryView.swift
          grep -F 'Button("نسخة مكررة أولى")' Feather/Views/Library/LibraryView.swift
          grep -F 'Button("نسخة مكررة خامسة")' Feather/Views/Library/LibraryView.swift
          grep -F 'Button("تكرار عشوائي")' Feather/Views/Library/LibraryView.swift
          grep -F 'WSActionButton(title: "تثبيت")' Feather/Views/Library/LibraryView.swift
          grep -F 'options.post_installAppAfterSigned = true' Feather/Views/Library/LibraryView.swift
          grep -F 'isLibraryOnlyImport' Feather/Utilities/Handlers/AppFileHandler.swift

      - name: Commit patch and remove one-time files
        run: |
          git config user.name 'ikiraplus'
          git config user.email 'rhomy1515@gmail.com'
          git rm .github/workflows/apply-library-card-actions.yml scripts/apply_library_actions.py
          git add Feather/Views/Library/LibraryView.swift Feather/Utilities/Handlers/AppFileHandler.swift
          git commit -m 'Restore Library import and add install duplicate actions'
          git push
