name: Apply installer UI fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-install-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified source edits
        run: python3 scripts/fix-install-ui.py

      - name: Verify expected changes
        run: |
          set -euo pipefail
          grep -F 'case .get: return "تحميل"' Feather/Views/Common/BSStore.swift
          grep -F 'Button("تحميل وتثبيت مباشر")' Feather/Views/Common/BSStore.swift
          grep -F 'Button("تحميل وتثبيت مكرر")' Feather/Views/Common/BSStore.swift
          grep -F 'BSGetPill(sourceURL: item.sourceURL' Feather/Views/Common/BSAppList.swift
          grep -F 'Button("تحميل وتثبيت مباشر")' Feather/Views/Library/LibraryView.swift
          grep -F 'Button("تحميل وتثبيت مكرر")' Feather/Views/Library/LibraryView.swift
          ! grep -F 'Task.sleep(nanoseconds: 250_000_000)' Feather/Views/Library/LibraryView.swift
          ! grep -F 'Task.sleep(nanoseconds: 450_000_000)' Feather/Views/Library/LibraryView.swift

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Feather/Views/Common/BSStore.swift Feather/Views/Common/BSAppList.swift Feather/Views/Library/LibraryView.swift
          git diff --cached --check
          git commit -m "Fix Arabic install choices and file import timing"
          git push origin HEAD:main

      - name: Build fixed main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
