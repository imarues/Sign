name: Source Backup ZIP

on:
  push:
    branches:
      - zip-backup-builder-2026-10-19

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact saved commit
        uses: actions/checkout@v4
        with:
          ref: 8939c4ad2663264a1a933281e02cb5fb13dd63ad
          fetch-depth: 1

      - name: Create ZIP
        run: |
          zip -r BatSign-backup-2026-10-19-8939c4a.zip . -x '.git/*'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BatSign-backup-2026-10-19-8939c4a
          path: BatSign-backup-2026-10-19-8939c4a.zip
          if-no-files-found: error
