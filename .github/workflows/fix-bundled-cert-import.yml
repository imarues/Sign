name: Apply bundled certificate import fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bundled-cert-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bundled certificate import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Feather/FeatherApp.swift')
          text = path.read_text()

          old = '''\tprivate func _addDefaultCertificates() {
          \t\tguard
          \t\t\tUserDefaults.standard.bool(forKey: "feather.didImportDefaultCertificates") == false,
          \t\t\tlet signingAssetsURL = Bundle.main.url(forResource: "signing-assets", withExtension: nil)
          \t\telse {
          \t\t\treturn
          \t\t}
          \t\t
          \t\tdo {
          \t\t\tlet folderContents = try FileManager.default.contentsOfDirectory(
          \t\t\t\tat: signingAssetsURL,
          \t\t\t\tincludingPropertiesForKeys: nil,
          \t\t\t\toptions: .skipsHiddenFiles
          \t\t\t)
          \t\t\t
          \t\t\tfor folderURL in folderContents {
          \t\t\t\tguard folderURL.hasDirectoryPath else { continue }
          \t\t\t\t
          \t\t\t\tlet certName = folderURL.lastPathComponent
          \t\t\t\t
          \t\t\t\tlet p12Url = folderURL.appendingPathComponent("cert.p12")
          \t\t\t\tlet provisionUrl = folderURL.appendingPathComponent("cert.mobileprovision")
          \t\t\t\tlet passwordUrl = folderURL.appendingPathComponent("cert.txt")
          \t\t\t\t
          \t\t\t\tguard
          \t\t\t\t\tFileManager.default.fileExists(atPath: p12Url.path),
          \t\t\t\t\tFileManager.default.fileExists(atPath: provisionUrl.path),
          \t\t\t\t\tFileManager.default.fileExists(atPath: passwordUrl.path)
          \t\t\t\telse {
          \t\t\t\t\tLogger.misc.warning("Skipping \\(certName): missing required files")
          \t\t\t\t\tcontinue
          \t\t\t\t}
          \t\t\t\t
          \t\t\t\tlet password = try String(contentsOf: passwordUrl, encoding: .utf8)
          \t\t\t\t
          \t\t\t\tFR.handleCertificateFiles(
          \t\t\t\t\tp12URL: p12Url,
          \t\t\t\t\tprovisionURL: provisionUrl,
          \t\t\t\t\tp12Password: password,
          \t\t\t\t\tcertificateName: certName,
          \t\t\t\t\tisDefault: true
          \t\t\t\t) { _ in
          \t\t\t\t\t
          \t\t\t\t}
          \t\t\t}
          \t\t\tUserDefaults.standard.set(true, forKey: "feather.didImportDefaultCertificates")
          \t\t} catch {
          \t\t\tLogger.misc.error("Failed to list signing-assets: \\(error)")
          \t\t}
          \t}'''

          new = '''\tprivate func _addDefaultCertificates() {
          \t\tguard let signingAssetsURL = Bundle.main.url(
          \t\t\tforResource: "signing-assets",
          \t\t\twithExtension: nil
          \t\t) else {
          \t\t\tLogger.misc.error("Bundled signing-assets directory is missing")
          \t\t\treturn
          \t\t}

          \t\tdo {
          \t\t\tlet folderContents = try FileManager.default.contentsOfDirectory(
          \t\t\t\tat: signingAssetsURL,
          \t\t\t\tincludingPropertiesForKeys: [.isDirectoryKey],
          \t\t\t\toptions: .skipsHiddenFiles
          \t\t\t)

          \t\t\t// The old implementation trusted a one-shot UserDefaults flag. A
          \t\t\t// failed import therefore became permanent on that installation.
          \t\t\t// The provisioning UUID is the real source of truth: if the cert is
          \t\t\t// in Core Data, skip it; if it is not, repair it on this launch.
          \t\t\tvar existingProfileUUIDs = Set(
          \t\t\t\tStorage.shared.getAllCertificates().compactMap {
          \t\t\t\t\tStorage.shared.getProvisionFileDecoded(for: $0)?.UUID
          \t\t\t\t}
          \t\t\t)

          \t\t\tfor folderURL in folderContents where folderURL.hasDirectoryPath {
          \t\t\t\tlet certName = folderURL.lastPathComponent
          \t\t\t\tlet p12URL = folderURL.appendingPathComponent("cert.p12")
          \t\t\t\tlet provisionURL = folderURL.appendingPathComponent("cert.mobileprovision")
          \t\t\t\tlet passwordURL = folderURL.appendingPathComponent("cert.txt")

          \t\t\t\tguard
          \t\t\t\t\tFileManager.default.fileExists(atPath: p12URL.path),
          \t\t\t\t\tFileManager.default.fileExists(atPath: provisionURL.path),
          \t\t\t\t\tFileManager.default.fileExists(atPath: passwordURL.path)
          \t\t\t\telse {
          \t\t\t\t\tLogger.misc.warning("Skipping \\(certName): missing required files")
          \t\t\t\t\tcontinue
          \t\t\t\t}

          \t\t\t\tguard let decoded = CertificateReader(provisionURL).decoded else {
          \t\t\t\t\tLogger.misc.error("Skipping \\(certName): invalid mobileprovision")
          \t\t\t\t\tcontinue
          \t\t\t\t}

          \t\t\t\tguard !existingProfileUUIDs.contains(decoded.UUID) else {
          \t\t\t\t\tLogger.misc.info("Bundled certificate \\(certName) is already imported")
          \t\t\t\t\tcontinue
          \t\t\t\t}

          \t\t\t\tlet password = try String(contentsOf: passwordURL, encoding: .utf8)
          \t\t\t\t\t.trimmingCharacters(in: .whitespacesAndNewlines)

          \t\t\t\tguard !password.isEmpty else {
          \t\t\t\t\tLogger.misc.error("Skipping \\(certName): empty P12 password")
          \t\t\t\t\tcontinue
          \t\t\t\t}

          \t\t\t\t// Reserve this profile for this launch before the asynchronous
          \t\t\t\t// import starts, preventing two bundled entries with the same
          \t\t\t\t// provisioning UUID from racing each other.
          \t\t\t\texistingProfileUUIDs.insert(decoded.UUID)

          \t\t\t\tFR.handleCertificateFiles(
          \t\t\t\t\tp12URL: p12URL,
          \t\t\t\t\tprovisionURL: provisionURL,
          \t\t\t\t\tp12Password: password,
          \t\t\t\t\tcertificateName: certName,
          \t\t\t\t\tisDefault: true
          \t\t\t\t) { error in
          \t\t\t\t\tif let error {
          \t\t\t\t\t\tLogger.misc.error("Bundled certificate \\(certName) import failed: \\(error.localizedDescription)")
          \t\t\t\t\t} else {
          \t\t\t\t\t\tUserDefaults.standard.set(true, forKey: "feather.didImportDefaultCertificates")
          \t\t\t\t\t\tLogger.misc.info("Bundled certificate \\(certName) imported")
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t} catch {
          \t\t\tLogger.misc.error("Failed to list signing-assets: \\(error.localizedDescription)")
          \t\t}
          \t}'''

          if old not in text:
              raise SystemExit('Expected bundled certificate function not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify patch
        run: |
          set -euo pipefail
          grep -F 'Bundled signing-assets directory is missing' Feather/FeatherApp.swift
          grep -F 'existingProfileUUIDs' Feather/FeatherApp.swift
          grep -F '.trimmingCharacters(in: .whitespacesAndNewlines)' Feather/FeatherApp.swift
          ! grep -F 'UserDefaults.standard.bool(forKey: "feather.didImportDefaultCertificates") == false' Feather/FeatherApp.swift
          git diff --check

      - name: Commit source fix and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bundled-cert-import.yml
          git add Feather/FeatherApp.swift
          git commit -m "Repair bundled certificate import on every launch"
          git push origin HEAD:main
