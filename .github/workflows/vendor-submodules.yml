name: Vendor submodules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-submodules.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Convert submodules to regular directories
        shell: bash
        run: |
          set -euo pipefail

          test -d Zsign
          test -d IDeviceKitten

          mkdir -p /tmp/vendor
          cp -a Zsign /tmp/vendor/Zsign
          cp -a IDeviceKitten /tmp/vendor/IDeviceKitten

          rm -f /tmp/vendor/Zsign/.git
          rm -f /tmp/vendor/IDeviceKitten/.git

          git rm -f Zsign IDeviceKitten
          git rm -f .gitmodules

          mv /tmp/vendor/Zsign ./Zsign
          mv /tmp/vendor/IDeviceKitten ./IDeviceKitten

          git add Zsign IDeviceKitten

          # This workflow is only needed for this one-time conversion.
          git rm -f .github/workflows/vendor-submodules.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor Zsign and IDeviceKitten into repository"
          git push origin HEAD:main
