name: Build BatSign

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          CANDIDATES=$(mktemp)
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            NAME=$(basename "$APP" .app)
            if printf '%s' "$NAME" | grep -qiE 'beta|_rc'; then continue; fi
            VER=${NAME#Xcode}
            VER=${VER#_}
            if ! printf '%s' "$VER" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then continue; fi
            if [ "${VER%%.*}" -lt 26 ] 2>/dev/null; then continue; fi
            NORM=$(printf '%s' "$VER" | awk -F. '{printf "%d.%d.%d", $1, $2+0, $3+0}')
            printf '%s %s\n' "$NORM" "$APP" >> "$CANDIDATES"
          done
          SELECTED=$(sort -V "$CANDIDATES" | tail -1 | awk '{print $2}')
          rm -f "$CANDIDATES"
          if [ -z "$SELECTED" ]; then
            echo "No stable Xcode 26 or newer on this runner; the build needs its iOS 26 SDK." >&2
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos"

      - name: Set marketing version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          agvtool new-marketing-version "${GITHUB_REF_NAME#v}"

      - name: Set build number (commit count, always increasing)
        run: |
          agvtool new-version -all "$(git rev-list --count HEAD)"

      - name: Verify repaired import source
        run: |
          set -euo pipefail
          grep -F 'existingProfileUUIDs' Feather/FeatherApp.swift
          grep -F '.trimmingCharacters(in: .whitespacesAndNewlines)' Feather/FeatherApp.swift
          ! grep -F 'UserDefaults.standard.bool(forKey: "feather.didImportDefaultCertificates") == false' Feather/FeatherApp.swift
          grep -F '_stageLocalImportsAndPresentChoice(urls)' Feather/Views/Library/LibraryView.swift
          grep -F 'BatSignPickedApps' Feather/Views/Library/LibraryView.swift

      - name: Build (unsigned, iOS device)
        run: |
          make iphoneos

      - name: Verify signing assets inside IPA
        run: |
          set -euo pipefail
          IPA="packages/BatSign.ipa"
          BASE="Payload/BatSign.app/signing-assets/iKiraPlus"
          unzip -Z1 "$IPA" | grep -Fx "$BASE/cert.p12"
          unzip -Z1 "$IPA" | grep -Fx "$BASE/cert.mobileprovision"
          unzip -Z1 "$IPA" | grep -Fx "$BASE/cert.txt"
          test "$(unzip -p "$IPA" "$BASE/cert.txt")" = "$(tr -d '\r\n' < Feather/signing-assets/iKiraPlus/cert.txt)"
          test -n "$(unzip -p "$IPA" "$BASE/cert.txt")"
          echo "Verified exact signing-assets directory and normalized password in IPA"

      - name: Package IPA
        run: |
          ls -la packages/
          APP=$(find _build/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "Built app: $APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatSign-ipa
          path: packages/BatSign.ipa
          if-no-files-found: error

      - name: Release tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BatSign ${{ github.ref_name }}
          files: packages/BatSign.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Release main build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BatSign Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: packages/BatSign.ipa
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
