# Final validation trigger after selective 0.0.4 conflict fixes
name: Test BatSign 0.0.4 Port

on:
  push:
    branches: [port-batsign-0.0.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          CANDIDATES=$(mktemp)
          for APP in /Applications/Xcode*.app; do
            [ -d "$APP" ] || continue
            NAME=$(basename "$APP" .app)
            if printf '%s' "$NAME" | grep -qiE 'beta|_rc'; then continue; fi
            VER=${NAME#Xcode}
            VER=${VER#_}
            if ! printf '%s' "$VER" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then continue; fi
            if [ "${VER%%.*}" -lt 26 ] 2>/dev/null; then continue; fi
            NORM=$(printf '%s' "$VER" | awk -F. '{printf "%d.%d.%d", $1, $2+0, $3+0}')
            printf '%s %s\n' "$NORM" "$APP" >> "$CANDIDATES"
          done
          SELECTED=$(sort -V "$CANDIDATES" | tail -1 | awk '{print $2}')
          rm -f "$CANDIDATES"
          if [ -z "$SELECTED" ]; then
            echo "No stable Xcode 26 or newer on this runner." >&2
            exit 1
          fi
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version

      - name: Verify custom fork safeguards
        run: |
          set -euo pipefail
          grep -F 'existingProfileUUIDs' Feather/FeatherApp.swift
          grep -F 'FileImporterRepresentableView(' Feather/Views/Library/LibraryView.swift
          grep -F 'BatSignLibraryOnly_' Feather/Views/Library/LibraryView.swift
          grep -F 'isLibraryOnlyImport' Feather/Utilities/Handlers/AppFileHandler.swift

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          make iphoneos
